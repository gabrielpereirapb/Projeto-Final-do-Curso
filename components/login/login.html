<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    <main class="login-container">
        <section class="login-box">
            <div class="logo">
                <img src="../../assets/Imagens/logo_azul.png" alt="Logo" width="120px">
            </div>
            <h2>Login</h2>
            <form action="login_submit.html" method="post">
                <div class="input-group">
                    <i class="bi bi-person-fill"></i>
                    <input type="text" placeholder="Usuário" name="username" required>
                </div>
                <div class="input-group">
                    <i class="bi bi-lock-fill"></i>
                    <input type="password" placeholder="Senha" name="password" required>
                </div>
                <button type="submit" class="btn-login">Entrar</button>
            </form>
            <div class="register-link">
                <p>Não possui uma conta? <a href="../cadastrarusuario/cadastrarusuario.html">Cadastre-se</a></p>
            </div>
        </section>
    </main>
</body>
</html>
